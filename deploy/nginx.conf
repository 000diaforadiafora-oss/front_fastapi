# Sample Nginx configuration for serving the Planetschool frontend
# and proxying FastAPI endpoints. Adjust paths, certificates, and
# upstream addresses to match your environment before deploying.

# Redirect HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name countex.space www.countex.space;

    # Allow Let's Encrypt/Certbot challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://countex.space$request_uri;
}

# HTTPS server for the SPA and API proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name countex.space www.countex.space;

    # SSL certificates (update with the actual certificate paths)
    ssl_certificate /etc/letsencrypt/live/countex.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/countex.space/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/countex.space/chain.pem;

    # Hardened TLS defaults
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Serve the built frontend
    root /var/www/front_fastapi;
    index index.html;

    # Cache immutable build assets for longer
    location ~* \.(?:js|css|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri /index.html;
    }

    # SPA fallback for all other routes
    location / {
        try_files $uri /index.html;
    }

    # Optional proxy block if the FastAPI backend is hosted on the same server.
    # Remove or adjust if your API is on a different host.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
