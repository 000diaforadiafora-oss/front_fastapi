# Sample Nginx configuration for serving the Planetschool frontend
# and proxying FastAPI endpoints. Adjust paths, certificates, and
# upstream addresses to match your environment before deploying.

# ------------------------------------------------------------------
# Cache policy for static assets. Place the map block inside the
# `http { ... }` context if you split this snippet across files.
# ------------------------------------------------------------------
map $sent_http_content_type $cache_expires {
    default                    off;
    "~*text/html"              0;
    "~*application/javascript" 1y;
    "~*text/css"               1y;
    "~*font/"                  1y;
    "~*image/"                 30d;
}

# Redirect HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name countex.space www.countex.space;

    # Allow Let's Encrypt/Certbot challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://countex.space$request_uri;
}

# HTTPS server for the SPA and API proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name countex.space www.countex.space;

    # SSL certificates (update with the actual certificate paths)
    ssl_certificate /etc/letsencrypt/live/countex.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/countex.space/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/countex.space/chain.pem;

    # Hardened TLS defaults
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Serve the built frontend
    root /var/www/front_fastapi;
    index index.html;

    # Upload and inference timeouts for larger samples
    client_max_body_size 25M;

    # Security headers for the SPA responses
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=()" always;

    # Compression (enable brotli if the module is available)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache immutable build assets for longer while keeping SPA shell uncached
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g)$ {
        expires $cache_expires;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.html;
    }

    # SPA fallback for all other routes
    location / {
        try_files $uri /index.html;
    }

    # Optional proxy block if the FastAPI backend is hosted on the same server.
    # Remove or adjust if your API is on a different host.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
